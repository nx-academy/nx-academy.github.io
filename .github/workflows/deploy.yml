name: Deploy NX Website to GH Pages

on:
  push:
    branches: ["main"]
  # Chaque lundi à 5 h UTC : fait avancer le thème d'automne (branches qui se
  # dégarnissent, tapis qui s'épaissit) même sans merge. Voir src/utils/season.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Repli le temps que les secrets TURSO_* soient créés. À retirer ensuite.
      ASTRO_DB_REMOTE_URL: ${{ secrets.ASTRO_DB_REMOTE_URL }}
      ASTRO_DB_APP_TOKEN: ${{ secrets.ASTRO_DB_APP_TOKEN }}

    steps:
      - name: Checking out
        uses: actions/checkout@v4
      - name: Setting up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Installing dependencies
        run: npm ci
      - name: Running the test
        run: npm test
      - name: Running Prettier (check)
        run: npm run prettier:check
      - name: Building project
        run: npm run build
      - name: Setting up Pages
        uses: actions/configure-pages@v5
      - name: Uploading artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
      - name: Deploying to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
